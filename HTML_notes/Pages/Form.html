<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Elements</title>
</head>
<body>
    <form action="index.php" method="POST" enctype="multipart/form-data">
    <!--`action="index php"` is to send data from a form into a difrent page hidden from the user `method` specifys between GET and POST, POST is for sensitive info and GET is for insensitive data. all of this would go inside of the opening form tag-->
    <label for="username">Username</label>
    <input type="text" id="username" placeholder="type a user name ex `bill`" minlength="6" maxlength="15" required>
    <br>

    <label for="pasword">Password</label>
    <input type="password" id="password" minlength="6" maxlength="15">
    <br>

    <label for="email">Email</label>
    <input type="email" id="email" placeholder="example@mail.com">
    <br>

    <label for="phone">Phone #</label>
    <input type="tel" id="phone" placeholder="(123)-456-7890" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}">
    <br>

    <label for="date">Birthday</label>
    <input type="date" id="date">
    <br>

    <label for="quan">Quantity</label>
    <input type="number" id="quan" min="0" max="99">
    <br>

    <lable for="title">Title</lable>
    <br>

    <lable for="mr">Mr.</lable>
    <input type="radio" id="mr" value="Mr." name="title">
    <lable for="ms">Ms.</lable>
    <input type="radio" id="ms" value="Ms." name="title">
    <lable for="phd">PhD.</lable>
    <input type="radio" id="phd" value="PhD." name="title">
    <br>

    <lable for="payment">Payment</lable>
    <select id="payment">
        <option value="Visa">Visa</option>
        <option value="MasterCard">MasterCard</option>
        <option value="Gift_card">Gift Card</option>
    </select>
    <br>

    <lable for="check box">Subscribe</lable>
    <input type="checkbox" id="check box">
    <br>

    <lable for="comment">Comment</lable>
    <textarea id="comment"></textarea>
    <br>
    
    <lable for="file">Insert Image</lable>
    <input type="file" id="file" accept="image/png">
    <br>
    
    <input type="reset"><br>
    <input type="submit">
    </form>
</body>
</html>
