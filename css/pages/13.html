<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./13combinators.css">
</head>
<body>
    <!--
    Combinators= explains the relationship between listed selectors
     = decendant
    > = child
    ~ = general sibling
    + = adjacent sibling
    selector > selector
    div > p
    -->

    <div id="container">
        <p>i am child 1</p>
        <p>i am child 2</p>
        <div>
            <p>i am decendant</p>
        </div>
        
    </div>
    <p>i am general sibling 1</p>
    <p>i am general sibling 2</p>
</body>
</html>
